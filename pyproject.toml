[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ncdb"
version = "0.1.0"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "sqlalchemy",
	"netCDF4",
	"cartopy",
]

[tool.setuptools.packages.find]
include = ["ncdb*"]

[tool.setuptools.package-data]
ncdb = ["plotting/cartopy_data/**/*"]

[tool.setuptools]
include-package-data = true
